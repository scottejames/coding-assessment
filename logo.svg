<svg width="980" height="300" viewBox="0 0 980 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Coding Assessment">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1614"/>
      <stop offset="100%" stop-color="#271b18"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
    </pattern>
    <linearGradient id="beam" x1="247.5" y1="90.6" x2="371.4" y2="-4.6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe0d9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffe0d9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="980" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="980" height="300" fill="url(#grid)"/>
  <rect x="0" y="294" width="980" height="6" fill="#e8574f"/>

  <!-- a beam catching the route -->
  <polygon points="234.3,73.4 260.6,107.7 405.6,40 337.2,-49.2" fill="url(#beam)"/>

  <!-- a route through five waypoints, one per problem -->
  <g transform="translate(170,150)">
    <circle r="112" fill="none" stroke="#e8574f" stroke-width="2" opacity="0.35"/>

    <path d="M -80,45 L -38,-40 L 12,30 L 55,-35 L 88,15"
          fill="none" stroke="#ffe0d9" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="1 11"/>

    <circle cx="-80" cy="45" r="15" fill="#2f211d" stroke="#e8574f" stroke-width="4"/>
    <circle cx="-80" cy="45" r="5" fill="#e8574f"/>

    <circle cx="-38" cy="-40" r="10" fill="#2f211d" stroke="#e8574f" stroke-width="3"/>
    <circle cx="12" cy="30" r="10" fill="#2f211d" stroke="#e8574f" stroke-width="3"/>
    <circle cx="55" cy="-35" r="10" fill="#2f211d" stroke="#e8574f" stroke-width="3"/>

    <circle cx="88" cy="15" r="12" fill="#2f211d" stroke="#ffe0d9" stroke-width="3"/>
    <path d="M 83,15 L 87,19 L 94,10" fill="none" stroke="#ffe0d9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="358" y="112" font-size="40" font-weight="700" letter-spacing="6" fill="#e8574f">CODING</text>
    <text x="354" y="212" font-size="84" font-weight="900" letter-spacing="1" fill="#f7f5f0">ASSESSMENT</text>
    <line x1="358" y1="230" x2="760" y2="230" stroke="#e8574f" stroke-width="4"/>
    <text x="358" y="258" font-size="16" font-weight="600" letter-spacing="3" fill="#ad948d">START HERE &#183; PROBLEM INDEX</text>
  </g>
</svg>
